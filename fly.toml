# fly.toml app configuration file generated for skwix on 2026-01-24T13:37:14+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'skwix'
primary_region = 'ams'
console_command = 'php /var/www/html/artisan tinker'

[build]
  [build.args]
    NODE_VERSION = '22'
    PHP_VERSION = '8.4'

[env]
  APP_ENV = 'production'
  APP_URL = 'https://skwix.fly.dev'
  LOG_CHANNEL = 'stderr'
  LOG_LEVEL = 'error'
  LOG_STDERR_FORMATTER = 'Monolog\Formatter\JsonFormatter'
  SESSION_DRIVER = 'cookie'
  SESSION_SECURE_COOKIE = 'true'
  DB_CONNECTION = 'sqlite'
  DB_DATABASE = '/var/www/html/storage/database/database.sqlite'
  QUEUE_CONNECTION = 'database'
  MAIL_MAILER = 'resend'

[mounts]
  source = 'sqlite_data'
  destination = '/var/www/html/storage/database'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[http_service.checks]]
  interval = '10s'
  timeout = '2s'
  grace_period = '5s'
  path = '/up'

[processes]
  app = ''

[deploy]
  release_command = 'sh -c "mkdir -p /var/www/html/storage/database && touch /var/www/html/storage/database/database.sqlite && php artisan migrate --force"'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
